name: Sync owner health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull owner-health snapshot into Supabase
        env:
          SYNC_OWNER_HEALTH_SECRET: ${{ secrets.SYNC_OWNER_HEALTH_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --request POST \
            --header "x-sync-owner-health-secret: ${SYNC_OWNER_HEALTH_SECRET}" \
            --header "content-type: application/json" \
            "https://zmhdclcjrkntrpynozvo.supabase.co/functions/v1/sync-owner-health"
