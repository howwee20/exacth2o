name: Publish exactH2O website

on:
  push:
    branches: [ej-supabase-research-portal]
  pull_request:
    branches: [ej-supabase-research-portal]
  workflow_dispatch:

permissions:
  contents: read

# Publishing serves the committed, locally built release, but only after this
# exact commit passes fast, deterministic checks: portal lint and unit tests, a
# rebuild that must reproduce every committed artifact byte for byte, and the
# chamber-agent, polling-budget and native-bridge tests. A failing check stops
# publication. Pull requests into the publishing branch run the same checks
# without deploying, and only the publishing branch itself is ever deployed.
# The slower cross-browser and database suites stay manual
# (verify.yml / verify-artifacts.yml), as chosen on 2026-10-15.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: research-portal/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix research-portal
      - name: Audit portal dependencies, including development tools
        run: npm audit --prefix research-portal
      - name: Portal lint and unit tests
        run: |
          npm run lint --prefix research-portal
          npm test --prefix research-portal
      - name: Rebuild and require the committed release
        run: |
          node scripts/build-product-release.mjs
          npm run audit:portal-surface --prefix research-portal
          git diff --exit-code -- applications.html portal.html portal-app demo.html demo-app applications-demo-app site-metrics.js
          test -z "$(git ls-files --others --exclude-standard -- portal-app demo-app applications-demo-app)"
      - name: Chamber agents, polling budget and installed-client compatibility
        run: |
          node --test supabase/functions/_shared/agent-polling.test.mjs supabase/functions/_shared/agent-wake.test.mjs supabase/functions/_shared/gas-mixer-native-policy.test.mjs supabase/functions/_shared/lighting-native-policy.test.mjs
          node --test scripts/budget/edge-budget-model.test.mjs
          python3 -m unittest discover -s controller-release/gas-mixer-native-bridge -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_supabase_usage_audit.py'

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ej-supabase-research-portal'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf site-dist
          mkdir -p site-dist/portal-app/assets

          cp site-metrics.js site-navigation.js one-pot-explainer.js site.css site-ambient.js site-ui.css site-brand-footer.css site-brand-footer.js CNAME .nojekyll index.html applications.html about.html support.html quote.html portal.html demo.html exacth2o-logo.jpeg site-dist/
          cp software-tour.css software-tour.js site-dist/
          cp -R media site-dist/
          cp 404.html privacy.html terms.html data-access.html favicon.svg robots.txt sitemap.xml site-dist/
          cp ceo.jpg cto.jpg coo.jpg ej-howe.jpg site-dist/
          cp team-*-20260913.webp team-binod-20260915.png site-dist/
          cp hero-greenhouse-*-20260913.webp site-dist/
          cp research-video-20260913.mp4 research-video-poster-20260913.jpg site-dist/
          cp product1.jpg product2.jpg product3.jpg site-dist/
          cp smart-scheduling-20260821.jpg sensor.jpg web-dashboard-20260804.jpg web-dashboard-20260831.webp easy-scaling-20260804.jpg data-visualization-20260804.jpg site-dist/
          cp product1.avif product2.avif product3.avif site-dist/
          cp sensor.avif site-dist/
          cp portal-preview-20261012.jpg portal-preview-20261013.jpg independent-irrigation-20261009-v2.jpg site-dist/
          cp applications-plant-stress-20260804.jpg applications-plant-phenotyping-20260804.jpg applications-research-greenhouse-20260804.jpg site-dist/

          cp -R applications-demo-app site-dist/
          cp -R demo-app site-dist/

          cp portal-app/assets/* site-dist/portal-app/assets/
          cp portal-app/gas-mixer-agent.py portal-app/pi-agent-update.sh site-dist/portal-app/
          cp portal-app/gas-mixer-native-bridge.py portal-app/install-gas-mixer-native-bridge.sh portal-app/rollback-gas-mixer-native-bridge.sh site-dist/portal-app/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
