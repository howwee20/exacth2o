name: Deploy exactH2O portal

on:
  push:
    branches:
      - ej-supabase-research-portal
  pull_request:
    branches:
      - ej-supabase-research-portal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            research-portal/package-lock.json
            controller-release/control-executor/package-lock.json
            controller-release/matt-balena-release-4174753/control-executor/package-lock.json
            controller-release/walker-telemetry-publisher/package-lock.json
            controller-release/matt-balena-release-4174753/api/package-lock.json
            controller-release/matt-balena-release-4174753/cron/package-lock.json
            controller-release/matt-balena-release-4174753/ui/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.65.5

      - name: Install locked dependencies
        run: |
          npm ci --prefix research-portal
          npm ci --prefix controller-release/control-executor
          npm ci --prefix controller-release/matt-balena-release-4174753/control-executor
          npm ci --prefix controller-release/walker-telemetry-publisher
          npm ci --prefix controller-release/matt-balena-release-4174753/api
          npm ci --prefix controller-release/matt-balena-release-4174753/cron
          npm ci --prefix controller-release/matt-balena-release-4174753/ui

      - name: Test control authorization and executor safety
        run: |
          node scripts/generate-platform-contracts.mjs --check
          node scripts/audit-walker-observation.mjs
          node scripts/audit-walker-live-boundary.mjs
          node --test supabase/functions/create-control-command/command-policy.test.mjs
          node --test supabase/functions/accept-invite/invite-role-policy.test.mjs
          node --test supabase/functions/_shared/abuse-prevention.test.mjs
          node --test supabase/functions/_shared/installation-config.test.mjs
          node --test supabase/functions/_shared/operation-ledger.test.mjs
          node --test supabase/functions/notification-dispatcher/notification-policy.test.mjs
          node --test supabase/functions/rd-admin-lab/pagination-policy.test.mjs
          node --test supabase/functions/rd-admin-lab/response-policy.test.mjs
          node --test supabase/functions/receive-walker-telemetry/receiver-policy.test.mjs
          node --test supabase/functions/experiment-builder/assistant-chat-policy.test.mjs
          node --test supabase/functions/experiment-builder/automation-policy.test.mjs
          node --test supabase/functions/experiment-builder/experiment-policy.test.mjs
          node --test supabase/functions/experiment-builder/request-utils.test.mjs
          node --test supabase/functions/sync-owner-health/config-refresh-policy.test.mjs
          node --test supabase/functions/sync-owner-health/rd-evidence-policy.test.mjs
          node --test supabase/functions/sync-owner-health/uptime-policy.test.mjs
          npm test --prefix controller-release/control-executor
          npm test --prefix controller-release/matt-balena-release-4174753/control-executor
          npm test --prefix controller-release/walker-telemetry-publisher
          npm test --prefix platform/controller-simulator
          npm audit --omit=dev --prefix controller-release/control-executor
          npm audit --omit=dev --prefix controller-release/matt-balena-release-4174753/control-executor
          npm audit --omit=dev --prefix controller-release/walker-telemetry-publisher
          npm test --prefix controller-release/matt-balena-release-4174753/api
          npm run build --prefix controller-release/matt-balena-release-4174753/api
          npm audit --omit=dev --prefix controller-release/matt-balena-release-4174753/api
          npm test --prefix controller-release/matt-balena-release-4174753/cron -- --runInBand
          npm run build --prefix controller-release/matt-balena-release-4174753/cron
          npm audit --omit=dev --prefix controller-release/matt-balena-release-4174753/cron
          npm run build --prefix controller-release/matt-balena-release-4174753/ui
          npm audit --omit=dev --prefix controller-release/matt-balena-release-4174753/ui
          deno check supabase/functions/accept-invite/index.ts
          deno check supabase/functions/assistant-automation-runner/index.ts
          deno check supabase/functions/create-control-command/index.ts
          deno check supabase/functions/experiment-builder/index.ts
          deno check supabase/functions/notification-dispatcher/index.ts
          deno check supabase/functions/rd-admin-lab/index.ts
          deno check supabase/functions/receive-walker-telemetry/index.ts
          deno check supabase/functions/receive-support-email/index.ts
          deno check supabase/functions/sync-owner-health/index.ts
          deno check supabase/functions/submit-quote/index.ts
          deno check supabase/functions/submit-support-request/index.ts
          ./scripts/verify-database-baseline.sh

      - name: Build and verify the portal
        run: |
          npm run check --prefix research-portal
          generated_changes="$(git status --porcelain --untracked-files=all -- portal-app portal.html)"
          if [ -n "$generated_changes" ]; then
            printf '%s\n' "$generated_changes"
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ej-supabase-research-portal'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf site-dist
          mkdir -p site-dist/portal-app/assets

          cp CNAME .nojekyll index.html applications.html about.html support.html quote.html portal.html exacth2o-logo.jpeg site-dist/
          cp ceo.jpg cto.jpg coo.jpg ej-howe.jpg site-dist/
          cp product1.jpg product2.jpg product3.jpg site-dist/
          cp scheduling.jpg sensor.jpg web-dashboard-20260804.jpg easy-scaling-20260804.jpg data-visualization-20260804.jpg site-dist/
          cp product1.avif product2.avif product3.avif site-dist/
          cp scheduling.avif sensor.avif site-dist/
          cp applications-plant-stress-20260804.jpg applications-plant-phenotyping-20260804.jpg applications-research-greenhouse-20260804.jpg site-dist/

          cp portal-app/assets/* site-dist/portal-app/assets/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
