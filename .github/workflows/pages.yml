name: Deploy exactH2O portal

on:
  push:
    branches:
      - ej-supabase-research-portal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf site-dist
          mkdir -p site-dist/portal-app/assets

          cp CNAME .nojekyll index.html applications.html about.html support.html quote.html portal.html site-dist/
          cp ceo.jpg cto.jpg coo.jpg ej-howe.jpg site-dist/
          cp product1.jpg product2.jpg product3.jpg product4.jpg product5.jpg product6.jpg site-dist/
          cp scheduling.jpg dashboard.jpg sensor.jpg scaling.jpg site-dist/

          cp portal-app/assets/portal.js portal-app/assets/portal.css site-dist/portal-app/assets/
          cp portal-app/product1.jpg portal-app/product2.jpg portal-app/product3.jpg site-dist/portal-app/
          cp portal-app/scheduling.jpg portal-app/dashboard.jpg portal-app/sensor.jpg site-dist/portal-app/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
