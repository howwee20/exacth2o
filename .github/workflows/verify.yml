name: Verify ExactH2O release (manual)

on:
  pull_request:
    paths:
      - 'controller/**'
      - 'controller-release/**'
      - 'scripts/build-controller-release*'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            research-portal/package-lock.json
            controller/control-executor/package-lock.json
            controller-release/walker-telemetry-publisher/package-lock.json
            controller/api/package-lock.json
            controller/cron/package-lock.json
            controller/ui/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.65.5

      - name: Install portal dependencies
        run: npm ci --prefix research-portal

      - name: Install controller dependencies
        run: |
          npm ci --prefix controller/control-executor
          npm ci --prefix controller-release/walker-telemetry-publisher
          npm ci --prefix controller/api
          npm ci --ignore-scripts --prefix controller/cron
          npm ci --prefix controller/ui

      - name: Verify generated controller packages
        run: |
          node --test scripts/build-controller-release.test.mjs
          python3 -m unittest discover -s controller-release/matt-health-reporting-20261020 -p 'test_*.py'
          node scripts/build-controller-release.mjs matt-safety-20261103 "$RUNNER_TEMP/exacth2o-safety-release"

      - name: Test control authorization and executor safety
        run: |
          node scripts/generate-platform-contracts.mjs --check
          node scripts/audit-walker-observation.mjs
          node scripts/audit-walker-live-boundary.mjs
          node --test supabase/functions/create-control-command/command-policy.test.mjs
          node --test supabase/functions/manual-hold/hold-policy.test.mjs
          node --test supabase/functions/accept-invite/invite-role-policy.test.mjs
          node --test supabase/functions/_shared/abuse-prevention.test.mjs
          node --test supabase/functions/_shared/secret-compare.test.mjs
          node --test supabase/functions/_shared/installation-config.test.mjs
          node --test supabase/functions/_shared/operation-ledger.test.mjs
          node --test supabase/functions/_shared/gas-mixer-native-policy.test.mjs
          node --test supabase/functions/_shared/agent-polling.test.mjs
          node --test supabase/functions/_shared/agent-wake.test.mjs
          node --test scripts/budget/edge-budget-model.test.mjs
          python3 -m unittest discover -s scripts -p 'test_supabase_usage_audit.py'
          python3 -m unittest discover -s controller-release/gas-mixer-native-bridge -p 'test_*.py'
          node --test supabase/functions/_shared/lighting-native-policy.test.mjs
          node --test supabase/functions/notification-dispatcher/notification-policy.test.mjs
          node --test supabase/functions/receive-walker-telemetry/receiver-policy.test.mjs
          node --test supabase/functions/experiment-builder/assistant-chat-policy.test.mjs
          node --test supabase/functions/experiment-builder/automation-policy.test.mjs
          node --test supabase/functions/experiment-builder/experiment-policy.test.mjs
          node --test supabase/functions/experiment-builder/request-utils.test.mjs
          node --test supabase/functions/sync-owner-health/config-refresh-policy.test.mjs
          node --test supabase/functions/sync-owner-health/rd-evidence-policy.test.mjs
          node --test supabase/functions/sync-owner-health/uptime-policy.test.mjs
          node --test supabase/functions/sync-owner-health/lease-policy.test.mjs
          node --test supabase/functions/website-analytics/report-policy.test.mjs
          node --test supabase/functions/walker-mixer-session/bridge-policy.test.mjs
          npm test --prefix controller/control-executor
          npm test --prefix controller-release/walker-telemetry-publisher
          npm test --prefix platform/controller-simulator
          npm audit --omit=dev --prefix controller/control-executor
          npm audit --omit=dev --prefix controller-release/walker-telemetry-publisher
          npm test --prefix controller/api
          npm run build --prefix controller/api
          npm audit --omit=dev --prefix controller/api
          npm test --prefix controller/cron -- --runInBand
          npm run build --prefix controller/cron
          npm audit --omit=dev --prefix controller/cron
          npm run build --prefix controller/ui
          npm audit --omit=dev --prefix controller/ui
          deno check supabase/functions/accept-invite/index.ts
          deno check supabase/functions/assistant-automation-runner/index.ts
          deno check supabase/functions/create-control-command/index.ts
          deno check supabase/functions/experiment-builder/index.ts
          deno check supabase/functions/gas-mixer-agent/index.ts
          deno check supabase/functions/gas-mixer-native-agent/index.ts
          deno check supabase/functions/gas-mixer-native-control/index.ts
          deno check supabase/functions/gas-mixer-session/index.ts
          deno check supabase/functions/lighting-native-agent/index.ts
          deno check supabase/functions/lighting-native-control/index.ts
          deno check supabase/functions/manual-hold/index.ts
          deno check supabase/functions/notification-dispatcher/index.ts
          deno check supabase/functions/receive-walker-telemetry/index.ts
          deno check supabase/functions/receive-support-email/index.ts
          deno check supabase/functions/sync-owner-health/index.ts
          deno check supabase/functions/website-analytics/index.ts
          deno check supabase/functions/submit-quote/index.ts
          deno check supabase/functions/submit-support-request/index.ts
          deno check supabase/functions/walker-mixer-session/index.ts
          ./scripts/verify-database-baseline.sh

      - name: Build and verify the portal
        run: |
          npm run check --prefix research-portal
          node research-portal/node_modules/vite/bin/vite.js build --config applications-preview/vite.config.mjs
          node demo-preview/build.mjs
          demo_changes="$(git status --porcelain --untracked-files=all -- demo.html demo-app applications-demo-app)"
          if [ -n "$demo_changes" ]; then
            printf '%s\n' "$demo_changes"
            echo 'The committed demo builds are out of date; run both demo builds and commit demo.html, demo-app/ and applications-demo-app/.'
            exit 1
          fi
          generated_changes="$(git status --porcelain --untracked-files=all -- portal-app portal.html site-metrics.js)"
          if [ -n "$generated_changes" ]; then
            printf '%s\n' "$generated_changes"
            echo 'The committed portal bundle or site-metrics.js is out of date; run npm run build --prefix research-portal and commit.'
            exit 1
          fi

