# Final additive service definition. The release assembler must combine this
# with the five exact service definitions and image records from release
# 3981239; it must never rebuild those pre-existing services.
services:
  walker_telemetry_publisher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - database_svc
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - walker_telemetry_cursor:/var/lib/walker-telemetry
    networks:
      - default
    environment:
      WALKER_TELEMETRY_PUBLISHER_INSTANCE: walker-pi5-a1c4ace2
      WALKER_TELEMETRY_DB_HOST: database_svc
      WALKER_TELEMETRY_DB_PORT: "3306"
      WALKER_TELEMETRY_DB_NAME: walkerlabs
      WALKER_TELEMETRY_DB_USER: walker_telemetry
      WALKER_TELEMETRY_RECEIVER_URL: https://zmhdclcjrkntrpynozvo.supabase.co/functions/v1/receive-walker-telemetry
      WALKER_TELEMETRY_BATCH_SIZE: "500"
      WALKER_TELEMETRY_MAX_ROWS_PER_CYCLE: "2000"
      WALKER_TELEMETRY_POLL_MS: "15000"
      WALKER_TELEMETRY_HEALTH_MAX_AGE_MS: "90000"

volumes:
  walker_telemetry_cursor:
