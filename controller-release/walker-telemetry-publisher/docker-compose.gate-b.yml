# Final sensing-only observer definition. The release assembler must carry the
# five original service images and definitions without rebuilding them.
services:
  walker_telemetry_publisher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - cron_svc
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - walker_telemetry_cursor:/var/lib/walker-telemetry
    environment:
      WALKER_TELEMETRY_PUBLISHER_INSTANCE: walker-pi5-a1c4ace2
      WALKER_SENSOR_READ_URL: http://cron_svc:3000/v1/sensors
      WALKER_TELEMETRY_RECEIVER_URL: https://zmhdclcjrkntrpynozvo.supabase.co/functions/v1/receive-walker-telemetry
      WALKER_TELEMETRY_BOOTSTRAP_CURSOR: "1518645"
      WALKER_SENSOR_SCAN_INTERVAL_MS: "600000"
      WALKER_TELEMETRY_HEARTBEAT_MS: "30000"
      WALKER_TELEMETRY_REQUEST_TIMEOUT_MS: "20000"
      WALKER_TELEMETRY_HEALTH_MAX_AGE_MS: "90000"

volumes:
  walker_telemetry_cursor: {}
