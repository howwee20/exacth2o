services:
  control_executor:
    build: ./control-executor
    restart: unless-stopped
    depends_on:
      - api_svc
    environment:
      EXACTH2O_LOCAL_API_BASE: "http://api_svc:8888/v1"
      EXACTH2O_CONTROL_EXECUTOR_DRY_RUN: "1"
      EXACTH2O_MANUAL_WATER_ENABLED: "0"
      EXACTH2O_CONTROL_EXECUTOR_POLL_MS: "5000"
      EXACTH2O_MANUAL_WATER_MAX_SECONDS: "60"
      EXACTH2O_PROJECT_ID: "${EXACTH2O_PROJECT_ID}"
      EXACTH2O_DEVICE_ID: "${EXACTH2O_DEVICE_ID}"
      EXACTH2O_SYNC_OWNER_HEALTH_URL: "${EXACTH2O_SYNC_OWNER_HEALTH_URL}"
      SYNC_OWNER_HEALTH_SECRET: "${SYNC_OWNER_HEALTH_SECRET}"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      EXACTH2O_DEVICE_TOKEN: "${EXACTH2O_DEVICE_TOKEN}"
