<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>exactH2O Research Portal</title>
    <script>
      (function () {
        var canonicalPath = "/portal";
        var params = new URLSearchParams(window.location.search);
        params.delete("v");
        var search = params.toString();
        var nextUrl = canonicalPath + (search ? "?" + search : "") + window.location.hash;
        if (window.location.pathname !== canonicalPath || window.location.search.indexOf("v=") !== -1) {
          window.history.replaceState(null, "", nextUrl);
        }
      })();
    </script>
    <script type="module" crossorigin src="portal-app/assets/portal.js?v=20260705-settings-ui"></script>
    <link rel="stylesheet" crossorigin href="portal-app/assets/portal.css?v=20260705-settings-ui">
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;margin:0;background:#f4f1eb;color:#0e1a14;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
        <div>
          <h1 style="margin:0 0 0.5rem;font-size:1.25rem;">Loading exactH2O Research Portal</h1>
          <p style="margin:0;color:rgba(14,26,20,0.64);">If this stays here, refresh Safari once.</p>
        </div>
      </main>
    </div>
  </body>
</html>
